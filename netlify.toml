# Until Florentine has picked a design, the site deploys both previews (noindex).
# After the decision: change the command to `npm run build` and set PUBLIC_THEME
# (c1 or c2) under Site settings → Environment variables.
[build]
  command = "npm run build:previews"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
